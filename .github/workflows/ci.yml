name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: traxion
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: traxion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U traxion" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://traxion:ci-only-password@localhost:5432/traxion
      TEST_DATABASE_URL: postgresql://traxion:ci-only-password@localhost:5432/traxion_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Migrations apply cleanly and match the schema
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Unit tests
        run: npm run test:unit

      - name: Integration & security tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      # Production dependencies must have no high/critical advisories.
      # Dev tooling is held to "critical" because some lint-only advisories have no upstream fix yet.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (all)
        run: npm audit --audit-level=critical

  e2e:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Create CI env file
        run: |
          cp .env.example .env
          sed -i "s/change-me-local-db-password/ci-db-$RANDOM$RANDOM/g; s/change-me-local-redis-password/ci-redis-$RANDOM$RANDOM/g; s/change-me-s3-access-key/ciaccess$RANDOM/; s/change-me-s3-secret-key/cisecret$RANDOM$RANDOM/; s/change-me-strong-admin-password/ci-admin-pass-$RANDOM$RANDOM/" .env
      - name: Start stack
        run: docker compose up -d --build --wait app worker
      - name: Seed admin
        run: |
          set -a; . ./.env; set +a
          docker compose run --rm -e SEED_ADMIN_EMAIL -e SEED_ADMIN_NAME -e SEED_ADMIN_PASSWORD migrate node dist/seed.mjs
      - name: Install Playwright
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: |
          set -a; . ./.env; set +a
          E2E_EMAIL="$SEED_ADMIN_EMAIL" E2E_PASSWORD="$SEED_ADMIN_PASSWORD" npm run test:e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color app worker | tail -200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
